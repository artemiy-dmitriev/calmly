# User factory definition module (must define cav_sim_factory and scan_processor_factory)
factories:
  module: "my_factories.py"  # User-defined Python file containing the factory functions

# Heuristic dataset generation
dataset:
  enabled: true
  quiet: false
  n_episodes: 200
  path: "data/heuristic_dataset.pkl"
  n_peaks: 3
  maxtem: 3
  mis_angle_min: -2.5e-4 
  mis_angle_max: 2.5e-4
  policy: "default" # or a pickle path
  seed: 42

# Behavioral Cloning
bc:
  enabled: true
  quiet: false
  policy_save_path: "models/bc_policy.pt"
  torch_num_threads: 10
  n_envs: 4
  device: "mps"
  net_arch: [64, 64]
  learning_rate: 1e-4
  n_epochs: 10
  seed: 42

# PPO Fine-Tuning
ppo:
  enabled: true
  quiet: false
  continue_training: false
  skip_bc: false
  device: "cpu"
  n_envs: 10
  torch_num_threads: 1
  learning_rate: 3e-4
  total_timesteps: 400000
  ent_coef: 0.02
  tensorboard_log: "logs/ppo"
  save_path: "models/ppo_policy"
  n_peaks: 3
  maxtem: 3
  mis_angle_min: -4e-4 
  mis_angle_max: 4e-4
  
# Evaluation
evaluation:
  enabled: true
  quiet: false
  n_episodes: 20
  agent_path: "iterative_policy"
  n_peaks: 3
  maxtem: 3
  mis_angle_min: -4.0e-4 
  mis_angle_max: 4.0e-4
  seed: 42
  save_path: "evaluation/evaluation_results.yaml"

